<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login — Bolivar Coffee & Lounge</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --fg: #171007;
      --bg: #f5f0e8;
      --cream: #f5f0e8;
      --accent: #c1874c;
      --accent-dark: #9c6a3a;
      --muted: #6b6259;
      --ff-display: 'Cormorant Garamond', Georgia, serif;
      --ff-body: 'Manrope', -apple-system, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--ff-body);
      background: var(--fg);
      color: var(--cream);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .login-card {
      max-width: 420px;
      width: 100%;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      backdrop-filter: blur(10px);
    }
    .login-card__logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-card__logo .mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px; height: 56px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.15);
      font-family: var(--ff-display);
      font-size: 1.6rem;
      font-weight: 600;
      margin-bottom: .75rem;
    }
    .login-card__logo h1 {
      font-family: var(--ff-display);
      font-size: 1.5rem;
      font-weight: 400;
      letter-spacing: .05em;
    }
    .login-card__logo p {
      color: var(--muted);
      font-size: .8rem;
      margin-top: .25rem;
      text-transform: uppercase;
      letter-spacing: .1em;
    }
    .login-form .form-group { margin-bottom: 1.25rem; }
    .login-form label {
      display: block;
      font-size: .75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: .4rem;
      color: rgba(255,255,255,.6);
    }
    .login-form input {
      width: 100%;
      padding: .8rem 1rem;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px;
      color: var(--cream);
      font-family: var(--ff-body);
      font-size: .95rem;
      transition: border-color .2s, box-shadow .2s;
    }
    .login-form input::placeholder { color: rgba(255,255,255,.25); }
    .login-form input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(193,135,76,.2);
      background: rgba(255,255,255,.08);
    }
    .login-btn {
      width: 100%;
      padding: .85rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: var(--ff-body);
      font-size: .9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      cursor: pointer;
      transition: background .2s, transform .1s;
      margin-top: .5rem;
    }
    .login-btn:hover { background: var(--accent-dark); }
    .login-btn:active { transform: scale(.98); }
    .login-btn:disabled { opacity: .6; cursor: not-allowed; }
    .login-error {
      text-align: center;
      color: #ef5350;
      font-size: .85rem;
      margin-top: 1rem;
      min-height: 1.2em;
    }
    .login-footer {
      text-align: center;
      margin-top: 2rem;
      font-size: .75rem;
      color: rgba(255,255,255,.3);
    }
    .login-footer a { color: var(--accent); text-decoration: none; }
    .default-creds {
      margin-top: 1.5rem;
      padding: .75rem 1rem;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 10px;
      font-size: .75rem;
      color: rgba(255,255,255,.5);
      text-align: center;
      line-height: 1.6;
    }
    .default-creds strong { color: rgba(255,255,255,.7); }
    @media (max-width: 480px) {
      .login-card { padding: 2rem 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-card__logo">
      <div class="mark">B</div>
      <h1>BOLIVAR</h1>
      <p>Admin Dashboard</p>
    </div>

    <form class="login-form" id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required placeholder="admin@bolivar.coffee" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Enter your password" autocomplete="current-password">
      </div>
      <button type="submit" class="login-btn" id="loginBtn">SIGN IN</button>
      <div class="login-error" id="loginError"></div>
    </form>

    <div class="default-creds" id="defaultCreds">
      Default login: <strong>admin@bolivar.coffee</strong> / <strong>admin123</strong>
    </div>

    <div class="login-footer">
      <a href="../index.html">← Back to website</a>
    </div>
  </div>

  <script>
  (function () {
    // If already logged in, redirect
    if (localStorage.getItem('bolivar_token')) {
      window.location.href = '../admin/index.html';
      return;
    }

    var form = document.getElementById('loginForm');
    var errorEl = document.getElementById('loginError');
    var btn = document.getElementById('loginBtn');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      errorEl.textContent = '';

      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;

      if (!email || !password) {
        errorEl.textContent = 'Please enter both email and password.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'SIGNING IN...';

      try {
        var res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: password })
        });

        var data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Login failed');

        // Store token
        localStorage.setItem('bolivar_token', data.token);
        localStorage.setItem('bolivar_user', JSON.stringify(data.user));

        window.location.href = '../admin/index.html';
      } catch (err) {
        errorEl.textContent = err.message || 'Login failed. Please check your credentials.';
        btn.disabled = false;
        btn.textContent = 'SIGN IN';
      }
    });
  })();
  </script>
</body>
</html>
