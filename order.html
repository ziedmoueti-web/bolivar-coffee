<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order Confirmed — Bolivar Coffee & Lounge</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .order-confirm {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: var(--bg);
    }
    .order-confirm__card {
      max-width: 520px;
      width: 100%;
      background: #fff;
      border-radius: 20px;
      padding: 3rem 2.5rem;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,.08);
    }
    .order-confirm__icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #e8f5e9;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 2rem;
    }
    .order-confirm__card h1 {
      font-family: var(--ff-display);
      font-size: 1.8rem;
      margin-bottom: .5rem;
    }
    .order-confirm__card .order-num {
      font-family: var(--ff-display);
      font-size: 1.2rem;
      color: var(--muted);
      margin: 1rem 0;
      word-break: break-all;
      font-size: .85rem;
    }
    .order-confirm__details {
      text-align: left;
      margin: 1.5rem 0;
      padding: 1.25rem;
      background: var(--bg);
      border-radius: 12px;
    }
    .order-confirm__details .detail-row {
      display: flex;
      justify-content: space-between;
      padding: .4rem 0;
      font-size: .9rem;
    }
    .order-confirm__details .detail-row.total {
      border-top: 1px solid rgba(0,0,0,.1);
      margin-top: .5rem;
      padding-top: .75rem;
      font-weight: 600;
      font-size: 1rem;
    }
    .order-confirm__actions {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .order-confirm__note {
      margin-top: 1.5rem;
      font-size: .85rem;
      color: var(--muted);
      line-height: 1.5;
    }
    .tracking-link {
      display: inline-block;
      margin-top: 1rem;
      padding: .5rem 1rem;
      background: var(--accent);
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-size: .85rem;
      font-weight: 600;
    }
    @media (max-width: 600px) {
      .order-confirm__card { padding: 2rem 1.5rem; }
      .order-confirm__card h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <div class="order-confirm">
    <div class="order-confirm__card" id="orderCard">
      <div class="order-confirm__icon">✓</div>
      <h1>Order Confirmed!</h1>
      <p>We've received your order and will prepare it shortly.</p>

      <div class="order-num" id="orderTracking">Loading...</div>

      <div class="order-confirm__details" id="orderDetails">
        <p style="text-align:center;color:var(--muted);">Loading order details...</p>
      </div>

      <div class="order-confirm__actions">
        <a class="btn btn--dark" href="index.html#menu">Back to Menu</a>
        <a class="btn btn--ghost" href="index.html#location" style="border:1px solid var(--fg);">Visit Us</a>
      </div>

      <p class="order-confirm__note">
        Save this page to track your order status.<br>
        For questions, call us at <a href="tel:+21622535138">+216 22 535 138</a>
      </p>
    </div>
  </div>

  <script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var token = params.get('token');

    if (!token) {
      document.getElementById('orderTracking').textContent = 'No order found.';
      document.getElementById('orderDetails').innerHTML = '<p style="text-align:center;">Please use the link from your order confirmation.</p>';
      return;
    }

    document.getElementById('orderTracking').textContent = 'Tracking: ' + token.substring(0, 16) + '...';

    fetch('/api/orders/track/' + token)
      .then(function (res) { return res.json(); })
      .then(function (order) {
        if (!order || order.error) {
          document.getElementById('orderDetails').innerHTML = '<p style="text-align:center;">Order not found.</p>';
          return;
        }

        var html = '';
        html += '<div class="detail-row"><span>Name</span><span>' + order.customer_name + '</span></div>';
        html += '<div class="detail-row"><span>Status</span><span style="text-transform:capitalize;font-weight:600;">' + order.status + '</span></div>';
        html += '<div class="detail-row"><span>Date</span><span>' + new Date(order.created_at).toLocaleString() + '</span></div>';
        html += '<hr style="border:none;border-top:1px solid rgba(0,0,0,.08);margin:.5rem 0">';
        (order.items || []).forEach(function (item) {
          html += '<div class="detail-row"><span>' + item.item_name_snapshot + ' × ' + item.quantity + '</span><span>' + item.subtotal.toFixed(3) + ' DT</span></div>';
        });
        html += '<div class="detail-row total"><span>Total</span><span>' + order.total.toFixed(3) + ' DT</span></div>';
        document.getElementById('orderDetails').innerHTML = html;
      })
      .catch(function () {
        document.getElementById('orderDetails').innerHTML = '<p style="text-align:center;">Failed to load order details.</p>';
      });
  })();
  </script>
</body>
</html>
